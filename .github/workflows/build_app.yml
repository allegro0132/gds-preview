name: Build and Release GDS Preview

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Python Backend Build ---
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Python Backend (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p desktop-ui/resources
          pyinstaller --clean --noconfirm --distpath desktop-ui/resources --workpath build/pyinstaller gds-engine.spec

      - name: Build Python Backend (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path desktop-ui/resources
          pyinstaller --clean --noconfirm --distpath desktop-ui/resources --workpath build/pyinstaller gds-engine.spec

      # --- Electron App Build ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: desktop-ui/package-lock.json

      - name: Install Node Dependencies
        run: |
          cd desktop-ui
          npm ci

      - name: Build and Package Electron App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd desktop-ui
          npm run dist

      # --- Upload Artifacts ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GDS-Preview-${{ matrix.os }}
          path: |
            desktop-ui/dist/*.dmg
            desktop-ui/dist/*.exe
            desktop-ui/dist/*.AppImage
            desktop-ui/dist/*.snap
            desktop-ui/dist/*.deb
