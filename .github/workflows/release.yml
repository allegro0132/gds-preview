name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install dependencies
      run: npm ci

    - name: Build Rust Engine
      run: |
        cd gds-engine-rust
        cargo build --release
        cd ..
        mkdir -p bin
        cp gds-engine-rust/target/release/gds-engine-rust bin/gds-engine-rust

    - name: Package Extension
      run: npx @vscode/vsce package

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: "*.vsix"
        generate_release_notes: true
