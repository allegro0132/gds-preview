name: Publish Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-binaries:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32
            arch: x64
            use_cross: false
            ext: .exe
          # Windows ARM64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: win32
            arch: arm64
            use_cross: false
            ext: .exe
          # Linux x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
            use_cross: false
            ext: ""
          # Linux ARM64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
            use_cross: true
            ext: ""
          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin
            arch: arm64
            use_cross: false
            ext: ""
          # macOS x64 (Intel)
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: darwin
            arch: x64
            use_cross: false
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        if: matrix.use_cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross
        shell: bash

      - name: Build
        working-directory: ./gds-engine-rust
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Rename Binary
        run: |
          mkdir -p ../bin
          src="target/${{ matrix.target }}/release/gds-engine-rust${{ matrix.ext }}"
          dst="../bin/gds-engine-rust-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}"
          cp "$src" "$dst"
        working-directory: ./gds-engine-rust
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}-${{ matrix.arch }}
          path: bin/gds-engine-rust-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}

  publish:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download all binaries
      uses: actions/download-artifact@v4
      with:
        path: bin
        pattern: binaries-*
        merge-multiple: true

    - name: List binaries
      run: ls -R bin

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci

    - name: Compile
      run: npm run compile

    - name: Publish to VS Code Marketplace
      run: npx @vscode/vsce publish -p ${{ secrets.VSCE_PAT }}
