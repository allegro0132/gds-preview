<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="shell.css">
    <title>GDS Preview</title>
</head>
<body>
    <div id="title-bar-drag-region"></div>
    <div id="tab-bar">
        <div id="tabs-container"></div>
        <div id="controls-container">
            <button id="btn-menu" title="Menu" style="display: none;">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M1 3h14v2H1V3zm0 4h14v2H1V7zm0 4h14v2H1v-2z"/>
                </svg>
            </button>
            <button id="btn-reload" title="Reload">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M13.5 8c0 3-2.5 5.5-5.5 5.5S2.5 11 2.5 8H1l3.5-3.5L8 8H6.5c0 2 1.5 3.5 3.5 3.5s3.5-1.5 3.5-3.5-1.5-3.5-3.5-3.5v-2c3 0 5.5 2.5 5.5 5.5z"/>
                </svg>
            </button>
            <button id="btn-stop" title="Stop">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M4 4h8v8H4z"/>
                </svg>
            </button>
            <button id="btn-open" title="Open GDS">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M13 4H7l-1-1H2v10h12V4z"/>
                </svg>
            </button>
        </div>
    </div>
    <script src="shell.js"></script>
</body>
</html>
